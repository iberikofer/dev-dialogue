name: Desktop Installer Release (main)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build & Publish Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup MSYS2 UCRT64 (Qt6 + CMake + Ninja)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qtkeychain-qt6
            mingw-w64-ucrt-x86_64-nlohmann-json

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Package Desktop Installer & latest.json
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;C:\msys64\ucrt64\share\qt6\bin;$env:PATH"
          $ver = "1.0.$env:GITHUB_RUN_NUMBER"
          & .\scripts\package-desktop.ps1 -Configuration Release -AppVersion $ver -ReleaseTag latest

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevDialogue-Setup-x64
          path: |
            dist/DevDialogue-Setup-*.exe
            dist/DevDialogue-Bootstrap-*-x64.exe
            dist/latest.json
          if-no-files-found: error

      - name: Publish Release to GitHub Releases (tag: latest)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dev Dialogue Latest (main)"
          body: "Automated build from main branch commit ${{ github.sha }}"
          make_latest: true
          files: |
            dist/DevDialogue-Setup-x64.exe
            dist/DevDialogue-Bootstrap-*-x64.exe
            dist/latest.json
