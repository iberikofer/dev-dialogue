name: CI & Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js Frontend
        run: pnpm --filter @dev-dialogue/web build

      - name: Build ASP.NET Core Backend
        run: dotnet build apps/api/DevDialogue.Api.csproj -c Release

  deployments-tracker:
    name: Production Deployment
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://dev-dialogue-web.onrender.com

    steps:
      - name: Record Render Production Deployment
        run: echo "Render frontend is live at https://dev-dialogue-web.onrender.com"
