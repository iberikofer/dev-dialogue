<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Face · model review</title>
    <style>
      :root {
        --bg: #0b0d12;
        --panel: #12151d;
        --panel-2: #171b25;
        --line: #232838;
        --text: #e6e9f2;
        --muted: #8b93a7;
        --accent: #5b8cff;
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
      }
      button:hover { border-color: #3a4256; background: #1d2230; }
      button.active { border-color: var(--accent); color: #cfdcff; background: #1b2540; }
      .app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
      .side {
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .side h1 { font-size: 15px; margin: 0; padding: 16px 16px 4px; letter-spacing: .2px; }
      .side .sub { color: var(--muted); font-size: 12px; padding: 0 16px 12px; }
      .list { overflow-y: auto; padding: 0 10px 10px; }
      .item {
        display: block;
        width: 100%;
        text-align: left;
        padding: 10px 10px;
        margin-bottom: 6px;
        border-radius: 10px;
        background: var(--panel-2);
      }
      .item .name { font-weight: 600; }
      .item .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .stage { position: relative; display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
      .canvas-wrap { position: relative; min-height: 0; overflow: hidden; }
      .viewport { position: absolute; inset: 0; }
      canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
      .hud {
        position: absolute;
        top: 12px;
        left: 12px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .hint {
        position: absolute;
        bottom: 12px;
        left: 12px;
        color: var(--muted);
        font-size: 12px;
        background: rgba(11,13,18,.72);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 10px 12px;
        border-top: 1px solid var(--line);
        background: var(--panel);
      }
      .bar .spacer { flex: 1; }
      .stat { color: var(--muted); font-size: 12px; }
      .drop {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(11,13,18,.8);
        border: 2px dashed var(--accent);
        color: #cfdcff;
        font-size: 15px;
        z-index: 5;
      }
      .error {
        margin: 12px;
        padding: 10px 12px;
        border: 1px solid #5b2733;
        background: #2a141b;
        color: #ffb4c0;
        border-radius: 10px;
      }
      .empty { padding: 8px; color: var(--muted); }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "htm": "https://esm.sh/htm@3.1.1",
          "three": "https://esm.sh/three@0.169.0",
          "three/addons/": "https://esm.sh/three@0.169.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { useState, useEffect, useRef, useCallback } from 'react';
      import { createRoot } from 'react-dom/client';
      import htm from 'htm';
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

      const html = htm.bind(React.createElement);

      // ---------------------------------------------------------------- viewer
      function Viewer({ url, buffer, clip, playing, wireframe, onReady, onError }) {
        const mountRef = useRef(null);
        const api = useRef({});

        useEffect(() => {
          const mount = mountRef.current;
          const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
          renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
          renderer.setClearColor(0x0b0d12);
          renderer.outputColorSpace = THREE.SRGBColorSpace;
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          mount.appendChild(renderer.domElement);

          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
          camera.position.set(0.35, 0.35, 0.6);

          const controls = new OrbitControls(camera, renderer.domElement);
          controls.enableDamping = true;
          controls.target.set(0, 0, 0);

          scene.add(new THREE.HemisphereLight(0x9fb4ff, 0x14161c, 1.2));
          const key = new THREE.DirectionalLight(0xffffff, 2.2);
          key.position.set(0.6, 0.9, 1.1);
          scene.add(key);
          const rim = new THREE.DirectionalLight(0x88aaff, 1.0);
          rim.position.set(-0.8, 0.2, -0.6);
          scene.add(rim);

          const clock = new THREE.Clock();
          const state = { mixer: null, actions: {}, root: null, clip: null, playing: true, wireframe: false };
          api.current = { state, scene, camera, controls, renderer, THREE };
          window.__viewer = api.current;   // handy for debugging

          const resize = () => {
            const w = mount.clientWidth || 1;
            const h = mount.clientHeight || 1;
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
          };
          resize();
          const ro = new ResizeObserver(resize);
          ro.observe(mount);

          let raf = 0;
          const loop = () => {
            raf = requestAnimationFrame(loop);
            const dt = clock.getDelta();
            if (state.mixer && state.playing) state.mixer.update(dt);
            controls.update();
            renderer.render(scene, camera);
          };
          loop();

          return () => {
            cancelAnimationFrame(raf);
            ro.disconnect();
            controls.dispose();
            renderer.dispose();
            mount.removeChild(renderer.domElement);
          };
        }, []);

        // load model
        useEffect(() => {
          const a = api.current;
          if (!a) return;
          const { state, scene, camera, controls } = a;
          if (state.root) {
            scene.remove(state.root);
            state.root.traverse((o) => {
              if (o.geometry) o.geometry.dispose();
              if (o.material) {
                const mats = Array.isArray(o.material) ? o.material : [o.material];
                mats.forEach((m) => {
                  Object.values(m).forEach((v) => v && v.isTexture && v.dispose());
                  m.dispose();
                });
              }
            });
          }
          state.root = null;
          state.mixer = null;
          state.actions = {};
          state.clip = null;

          if (!url && !buffer) return;

          const loader = new GLTFLoader();
          const onLoad = (gltf) => {
            const root = gltf.scene;
            state.root = root;
            scene.add(root);

            const mixer = new THREE.AnimationMixer(root);
            state.mixer = mixer;
            const names = [];
            gltf.animations.forEach((a) => {
              const action = mixer.clipAction(a);
              action.clampWhenFinished = true;
              action.loop = THREE.LoopRepeat;
              state.actions[a.name || 'Animation'] = action;
              names.push(a.name || 'Animation');
            });

            // frame the head (the biggest mesh), not the whole bust
            let head = null;
            let headTris = 0;
            root.traverse((o) => {
              if (!o.isMesh) return;
              const t = o.geometry?.index ? o.geometry.index.count / 3
                : (o.geometry?.attributes?.position?.count || 0) / 3;
              if (t > headTris) { headTris = t; head = o; }
            });
            const focus = head || root;
            const box = new THREE.Box3().setFromObject(focus);
            const size = box.getSize(new THREE.Vector3());
            const headH = size.y * 0.68;                    // keep the head, drop the bust
            const centre = new THREE.Vector3(
              box.min.x + size.x / 2,
              box.max.y - headH / 2,
              box.min.z + size.z / 2,
            );
            const vFov = (camera.fov * Math.PI) / 180;
            const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
            const dist = Math.max(
              headH / 2 / Math.sin(vFov / 2),
              Math.max(size.x, size.z) / 2 / Math.sin(hFov / 2),
            ) * 1.2;
            const dir = new THREE.Vector3(0.42, 0.26, 1).normalize();
            controls.target.copy(centre);
            camera.position.copy(centre).addScaledVector(dir, dist);
            camera.near = dist / 100;
            camera.far = dist * 100;
            camera.updateProjectionMatrix();
            controls.update();

            let tris = 0;
            root.traverse((o) => {
              if (o.isMesh && o.geometry?.index) tris += o.geometry.index.count / 3;
              else if (o.isMesh) tris += (o.geometry?.attributes?.position?.count || 0) / 3;
            });

            onReady({ clips: names, tris: Math.round(tris) });
          };
          const onErr = (e) => onError(String(e?.message || e));
          if (buffer) loader.parse(buffer, '', onLoad, onErr);
          else loader.load(url, onLoad, undefined, onErr);
        }, [url, buffer]);

        // clip selection / play state
        useEffect(() => {
          const a = api.current;
          if (!a) return;
          const { state } = a;
          Object.entries(state.actions).forEach(([name, action]) => {
            if (name === clip) {
              action.reset().play();
              action.paused = !playing;
            } else {
              action.stop();
            }
          });
          state.clip = clip;
          state.playing = playing;
        }, [clip, playing, url, buffer]);

        // wireframe
        useEffect(() => {
          const a = api.current;
          if (!a || !a.state.root) return;
          a.state.root.traverse((o) => {
            if (o.isMesh) {
              const mats = Array.isArray(o.material) ? o.material : [o.material];
              mats.forEach((m) => (m.wireframe = wireframe));
            }
          });
        }, [wireframe, url, buffer]);

        return html`<div className="viewport" ref=${mountRef}></div>`;
      }

      // ------------------------------------------------------------------ app
      function App() {
        const [models, setModels] = useState([]);
        const [file, setFile] = useState(null);
        const [buffer, setBuffer] = useState(null);
        const [clips, setClips] = useState([]);
        const [clip, setClip] = useState(null);
        const [playing, setPlaying] = useState(true);
        const [wireframe, setWireframe] = useState(false);
        const [stats, setStats] = useState(null);
        const [error, setError] = useState(null);
        const [drag, setDrag] = useState(false);

        // model list: prefer the live manifest, fall back to the inline one
        useEffect(() => {
          let alive = true;
          fetch(`models.json?t=${Date.now()}`)
            .then((r) => (r.ok ? r.json() : Promise.reject(new Error('no manifest'))))
            .catch(() => window.__MODELS__ || [])
            .then((list) => alive && setModels(list))
            .catch(() => alive && setModels([]));
          return () => { alive = false; };
        }, []);

        const current = models.find((m) => m.file === file);

        const onReady = useCallback((info) => {
          setClips(info.clips);
          setClip((c) => (info.clips.includes(c) ? c : info.clips[0] || null));
          setStats(info);
          setError(null);
        }, []);

        const onDrop = useCallback((e) => {
          e.preventDefault();
          setDrag(false);
          const f = e.dataTransfer.files?.[0];
          if (!f) return;
          setFile(f.name);
          setBuffer(null);
          f.arrayBuffer().then((buf) => {
            setBuffer(buf);
            setClips([]);
            setClip(null);
            setStats(null);
          });
        }, []);

        const pick = (name) => {
          setFile(name);
          setBuffer(null);
          setClips([]);
          setClip(null);
          setStats(null);
          setError(null);
        };

        return html`<${React.Fragment}>
          <div className="app">
            <aside className="side">
              <h1>3D Face · models</h1>
              <div className="sub">${models.length} model${models.length === 1 ? '' : 's'} in ./3dface</div>
              <div className="list">
                ${models.map((m) => html`
                  <button key=${m.file} className=${'item' + (m.file === file ? ' active' : '')} onClick=${() => pick(m.file)}>
                    <div className="name">${m.name}</div>
                    <div className="meta">${m.sizeLabel} · ${m.tris ? m.tris.toLocaleString() + ' tris' : '—'}</div>
                    <div className="meta">${(m.animations || []).length ? (m.animations || []).join(' · ') : 'no clips'}</div>
                  </button>`)}
                ${models.length === 0 && html`<div className="empty">No models found — run <code>node scan-models.mjs</code></div>`}
              </div>
            </aside>

            <main className="stage">
              <div className="canvas-wrap" onDragOver=${(e) => { e.preventDefault(); setDrag(true); }}
                   onDragLeave=${() => setDrag(false)} onDrop=${onDrop}>
                <${Viewer}
                  url=${file && !buffer ? file : null}
                  buffer=${buffer}
                  clip=${clip}
                  playing=${playing}
                  wireframe=${wireframe}
                  onReady=${onReady}
                  onError=${setError}
                />
                <div className="hud">
                  <button className=${playing ? 'active' : ''} onClick=${() => setPlaying((p) => !p)}>${playing ? '❚❚ pause' : '▶ play'}</button>
                  <button className=${wireframe ? 'active' : ''} onClick=${() => setWireframe((w) => !w)}>wireframe</button>
                </div>
                <div className="hint">drag and drop a .glb to preview it · scroll to zoom</div>
                ${drag && html`<div className="drop">drop a .glb to preview</div>`}
              </div>

              <div className="bar">
                ${clips.length === 0 && html`<span className="stat">${file ? 'no animation clips in this model' : 'select a model'}</span>`}
                ${clips.map((c) => html`
                  <button key=${c} className=${c === clip ? 'active' : ''} onClick=${() => setClip(c)}>${c}</button>`)}
                <span className="spacer"></span>
                <span className="stat">
                  ${current ? `${current.name} · ${current.sizeLabel}` : file ? file : ''}
                  ${stats ? ` · ${stats.tris.toLocaleString()} tris in scene` : ''}
                </span>
              </div>
            </main>
          </div>
          ${error && html`<div className="error">${error}</div>`}
        <//>`;
      }

      createRoot(document.getElementById('root')).render(html`<${App} />`);
    </script>
  </body>
</html>
